server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.karthik: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

spring:
  application:
    name: task-management-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_management_local}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: http://localhost:3000/auth/callback
            scope:
              - email
              - profile
              - openid
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://www.googleapis.com/oauth2/v4/token
            user-info-uri: https://www.googleapis.com/oauth2/v1/userinfo
            user-name-attribute: email

# JWT Configuration (local development)
app:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-that-must-be-at-least-32-characters-long-for-hs256}
    expiration: 86400000   # 24 hours in milliseconds
  oauth2:
    state-param-length: 32